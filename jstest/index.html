<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hamster Snack Game</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <h1>Hamster Snack Game</h1>
    <p>Hover over the seeds to feed the hamster! Don't overfeed the hamster... He can only eat 4 clicks...!</p>

    <h2 id="counter">Bites: 0 / 5</h2>

    <div id="game-area">
        <img id="hamster" src="images/hamster.png" alt="Hamster">
        <img id="seeds" src="images/seeds.png" alt="Sunflower seeds">
    </div>

</body>
</html>
